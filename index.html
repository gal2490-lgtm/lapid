<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-START-->
<title>לפיד</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f6f2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Heebo:wght@300;400;500;700&display=swap">
<style>
  :root {
    --bg: #15120e;
    --bg-2: #1d1913;
    --surface: #23201a;
    --surface-2: #2c2821;
    --line: #3a352c;
    --ink: #f3ede2;
    --ink-2: #c9c0b1;
    --muted: #8f867a;
    --amber: #f0a33a;
    --amber-ink: #1a1207;
    --teal: #58b8ad;
    --hue: 30;
    --tint: hsl(var(--hue) 45% 22%);
    --tint-2: hsl(var(--hue) 55% 32%);
    --tint-ink: hsl(var(--hue) 70% 82%);
    --shadow: 0 18px 40px -20px rgba(0,0,0,.7);
    --radius: 22px;
    --font-display: "Frank Ruhl Libre", "Times New Roman", serif;
    --font-body: "Heebo", "Assistant", "Segoe UI", Arial, sans-serif;
  }
  :root[data-theme="light"] {
    --bg: #f7f6f2;
    --bg-2: #efede6;
    --surface: #ffffff;
    --surface-2: #f4f2ec;
    --line: #e4e0d6;
    --ink: #1b1712;
    --ink-2: #4a433a;
    --muted: #7d7365;
    --amber: #c27a15;
    --amber-ink: #fff8ec;
    --teal: #1f8a7e;
    --tint: hsl(var(--hue) 55% 90%);
    --tint-2: hsl(var(--hue) 50% 78%);
    --tint-ink: hsl(var(--hue) 55% 24%);
    --shadow: 0 18px 40px -22px rgba(60,40,10,.35);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f7f6f2;
      --bg-2: #efede6;
      --surface: #ffffff;
      --surface-2: #f4f2ec;
      --line: #e4e0d6;
      --ink: #1b1712;
      --ink-2: #4a433a;
      --muted: #7d7365;
      --amber: #c27a15;
      --amber-ink: #fff8ec;
      --teal: #1f8a7e;
      --tint: hsl(var(--hue) 55% 90%);
      --tint-2: hsl(var(--hue) 50% 78%);
      --tint-ink: hsl(var(--hue) 55% 24%);
      --shadow: 0 18px 40px -22px rgba(60,40,10,.35);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #app { height: 100%; display: flex; flex-direction: column; direction: rtl; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, .tile:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; }
  ul { margin: 0; padding: 0; list-style: none; }

  /* ---------- top bar ---------- */
  .bar {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 8px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-family: var(--font-display); font-weight: 900; font-size: 26px; letter-spacing: -.01em; }
  .brand small { color: var(--muted); font-size: 12px; }
  .flame { display: inline-block; width: 12px; height: 16px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: linear-gradient(180deg, var(--amber), #d9532b); transform: translateY(2px); }
  .iconbtn { background: none; border: 1px solid var(--line); border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink-2); }
  .iconbtn svg { width: 18px; height: 18px; }

  /* ---------- feed ---------- */
  .feed {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    overscroll-behavior-y: contain;
    scrollbar-width: none;
    padding: 0 16px;
  }
  .feed::-webkit-scrollbar { display: none; }
  .slot {
    scroll-snap-align: start; scroll-snap-stop: always;
    height: 100%;
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column;
  }
  .card {
    flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    position: relative;
  }
  .card .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; }
  .c-article .text { margin-block: auto; }
  .c-video .text { flex: 0 0 auto; }
  .card .scroll::-webkit-scrollbar { display: none; }
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: .04em; color: var(--muted);
  }
  .eyebrow b { color: var(--tint-ink); font-weight: 500; }
  .eyebrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tint-2); }
  .foot {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 18px 12px;
    border-top: 1px solid var(--line);
    font-size: 13px; color: var(--ink-2);
  }
  .foot .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font-size: 13px; text-decoration: none; background: var(--surface-2);
    color: var(--ink);
  }
  .chip.primary { background: var(--amber); color: var(--amber-ink); border-color: transparent; font-weight: 500; }
  .chip.saved { background: var(--tint); color: var(--tint-ink); border-color: transparent; }
  .chip svg { width: 14px; height: 14px; }
  .react { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 18px 8px; border-top: 1px dashed var(--line); }
  .react span.q { font-size: 11px; color: var(--muted); margin-inline-end: 4px; }
  .react button { background: none; border: 1px solid transparent; border-radius: 999px; padding: 3px 9px; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .react button svg { width: 13px; height: 13px; }
  .react button.on { color: var(--tint-ink); background: var(--tint); border-color: var(--tint-2); }
  .react button.on.down { color: var(--ink-2); background: var(--surface-2); border-color: var(--line); }

  /* chapter card */
  .c-chapter .head {
    background: linear-gradient(160deg, var(--tint) 0%, var(--tint-2) 100%);
    color: var(--tint-ink);
    padding: 18px 20px 16px;
  }
  .c-chapter .head .eyebrow, .c-chapter .head .eyebrow b { color: var(--tint-ink); opacity: .9; }
  .c-chapter .idea {
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(24px, 6.4vw, 32px); line-height: 1.2; margin-top: 10px;
  }
  .c-chapter .body { padding: 16px 20px 8px; font-size: 16.5px; color: var(--ink); }
  .points { padding: 4px 20px 6px; display: grid; gap: 8px; }
  .points li { display: grid; grid-template-columns: 10px 1fr; gap: 12px; align-items: start; color: var(--ink-2); font-size: 15.5px; }
  .points li::before { content: ""; width: 10px; height: 10px; margin-top: 8px; border-radius: 2px; background: var(--tint-2); transform: rotate(45deg); }
  .apply { margin: 8px 20px 14px; padding: 12px 14px; border-inline-start: 3px solid var(--amber); background: var(--surface-2); border-radius: 8px; font-size: 15px; }
  .apply b { color: var(--amber); font-weight: 500; display: block; font-size: 12px; letter-spacing: .04em; margin-bottom: 2px; }
  .quote { margin: 0 20px 14px; font-family: var(--font-display); font-size: 17px; color: var(--ink-2); font-style: italic; direction: ltr; text-align: left; }
  .bookline { display: flex; align-items: center; gap: 12px; padding: 12px 20px 14px; margin-top: auto; }
  .cover {
    flex: 0 0 auto; width: 46px; height: 66px; border-radius: 4px 7px 7px 4px;
    background: linear-gradient(135deg, var(--tint-2), var(--tint));
    box-shadow: inset 6px 0 0 -3px rgba(0,0,0,.25);
    display: grid; place-items: center; color: var(--tint-ink);
    font-family: var(--font-display); font-weight: 900; font-size: 18px; overflow: hidden;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bookline .t { font-weight: 500; direction: ltr; text-align: left; line-height: 1.3; }
  .bookline .a { color: var(--muted); font-size: 13px; direction: ltr; text-align: left; }

  /* video card */
  .c-video .media {
    position: relative; flex: 1 1 auto; min-height: 220px; max-width: 100%;
    background: radial-gradient(120% 100% at 30% 20%, var(--tint-2), #0c0b09 75%);
    display: grid; place-items: center; overflow: hidden;
  }
  .c-video .media .dur { position: absolute; bottom: 12px; inset-inline-end: 14px; z-index: 1; font-size: 12px; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; }
  .c-video .media .mono { position: absolute; inset: auto -4% -18% auto; font-family: var(--font-display); font-weight: 900; font-size: 150px; line-height: 1; color: var(--tint-ink); opacity: .14; letter-spacing: -.04em; direction: ltr; }
  .c-video .media img, .c-video .media iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
  .play {
    position: relative; z-index: 1;
    width: 64px; height: 64px; border-radius: 50%; border: 0;
    background: var(--amber); color: var(--amber-ink);
    display: grid; place-items: center; box-shadow: 0 10px 30px -8px rgba(0,0,0,.7);
  }
  .play svg { width: 26px; height: 26px; margin-inline-start: 3px; }
  a.play { text-decoration: none; }
  .c-video .media .hint { position: absolute; bottom: 14px; inset-inline-start: 16px; z-index: 1; font-size: 12px; letter-spacing: .03em; color: var(--tint-ink); opacity: .85; }
  .c-video .text { padding: 16px 20px 10px; }
  .c-video .title { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.3; direction: ltr; text-align: left; margin-top: 8px; }
  .c-video .who { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--tint-2); color: var(--tint-ink); display: grid; place-items: center; font-weight: 700; font-family: var(--font-display); }
  .who .n { font-weight: 500; }
  .who .r { color: var(--muted); font-size: 13px; }
  .c-video .blurb { color: var(--ink-2); margin-top: 10px; font-size: 15px; }

  /* article card */
  .c-article .mast {
    padding: 22px 20px 14px; border-bottom: 3px double var(--line);
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  .c-article .mast .pub { font-family: var(--font-display); font-weight: 900; font-size: 22px; direction: ltr; text-align: left; }
  .c-article .mast .date { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .c-article .mast .logo { width: 34px; height: 34px; border-radius: 8px; object-fit: contain; background: #fff; padding: 3px; border: 1px solid var(--line); margin-inline-end: 10px; align-self: center; }
  .c-article .mast .pub { flex: 1 1 auto; }
  .avatar { overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .c-article .text { padding: 16px 20px 12px; }
  .c-article .title { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.3; direction: ltr; text-align: left; }
  .c-article .summary { margin-top: 12px; color: var(--ink-2); font-size: 15.5px; }
  .c-article .pubdesc { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 13px; }

  /* leader card */
  .c-leader .hero { flex: 1 1 auto; min-height: 200px; padding: 28px 20px; background: radial-gradient(120% 90% at 50% 0%, var(--tint-2), var(--tint) 70%); color: var(--tint-ink); display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; text-align: center; }
  .c-leader .hero .avatar { width: 96px; height: 96px; font-size: 38px; background: var(--tint-2); box-shadow: 0 0 0 6px color-mix(in srgb, var(--tint-ink) 18%, transparent); }
  .c-leader .name { font-family: var(--font-display); font-weight: 900; font-size: 30px; direction: ltr; text-align: center; line-height: 1.15; }
  .c-leader .name-he { font-size: 14px; opacity: .85; }
  .c-leader .text { padding: 16px 20px; }
  .c-leader .role { font-weight: 500; }
  .c-leader .why { color: var(--ink-2); margin-top: 8px; }
  .c-leader .vids { display: grid; gap: 8px; margin-top: 14px; }
  .c-leader .vids a { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; text-decoration: none; background: var(--surface-2); }
  .c-leader .vids .t { direction: ltr; text-align: left; font-size: 14px; line-height: 1.3; }
  .c-leader .vids .p { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: var(--amber); color: var(--amber-ink); display: grid; place-items: center; }
  .c-leader .vids .p svg { width: 12px; height: 12px; margin-inline-start: 2px; }

  /* book intro card */
  .c-book .hero { flex: 1 1 auto; min-height: 260px; padding: 28px 20px 22px; display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, var(--tint) 0%, var(--surface) 100%); }
  .c-book .hero .cover { width: 124px; height: 180px; font-size: 40px; box-shadow: inset 8px 0 0 -4px rgba(0,0,0,.25), 0 24px 30px -18px rgba(0,0,0,.7); }
  .c-book .title { font-family: var(--font-display); font-weight: 900; font-size: 26px; direction: ltr; text-align: center; line-height: 1.15; }
  .c-book .title-he { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
  .c-book .author { color: var(--muted); font-size: 14px; direction: ltr; text-align: center; margin-top: 4px; }
  .c-book .text { padding: 8px 20px 16px; }
  .c-book .why { font-size: 17px; }
  .c-book .rank { margin-top: 12px; color: var(--muted); font-size: 13px; }

  /* end card */
  .c-end { display: grid; place-items: center; text-align: center; padding: 24px; }
  .c-end h2 { font-family: var(--font-display); font-size: 28px; font-weight: 900; }
  .c-end p { color: var(--muted); margin-top: 8px; max-width: 30ch; }

  /* ---------- onboarding ---------- */
  .screen { position: absolute; inset: 0; z-index: 5; background: var(--bg); overflow-y: auto; direction: rtl; }
  .screen .inner { padding: calc(28px + env(safe-area-inset-top, 0px)) 20px calc(28px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; }
  .screen h2 { font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: 1.1; }
  .screen .lede { color: var(--ink-2); margin-top: 10px; max-width: 50ch; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 22px; }
  .tile {
    --hue: 30;
    position: relative; text-align: start;
    border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 14px 14px; min-height: 96px;
    background: var(--surface);
    display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    transition: transform .12s ease;
  }
  .tile .sw { width: 28px; height: 6px; border-radius: 3px; background: var(--tint-2); }
  .tile .n { font-weight: 500; line-height: 1.3; }
  .tile.on { background: var(--tint); border-color: var(--tint-2); color: var(--tint-ink); }
  .tile.on .sw { background: var(--tint-ink); }
  .tile:active { transform: scale(.98); }
  .tile .check { position: absolute; top: 12px; left: 12px; width: 20px; height: 20px; border-radius: 50%; background: var(--tint-ink); color: var(--tint); display: none; place-items: center; }
  .tile.on .check { display: grid; }
  .tile .check svg { width: 12px; height: 12px; }
  .cta { margin-top: 22px; width: 100%; border: 0; border-radius: 14px; padding: 15px; background: var(--amber); color: var(--amber-ink); font-weight: 700; font-size: 17px; }
  .cta:disabled { opacity: .45; cursor: default; }
  .fine { color: var(--muted); font-size: 13px; margin-top: 12px; }

  /* ---------- settings ---------- */
  .sect { margin-top: 26px; }
  .sect h3 { font-size: 14px; letter-spacing: .04em; color: var(--muted); font-weight: 500; margin-bottom: 10px; }
  .list { display: grid; gap: 6px; }
  .list .row { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 14px; }
  .list .row .l { direction: ltr; text-align: left; }
  .list .row .s { color: var(--muted); font-size: 12px; }
  .list .row a { text-decoration: none; }
  .srcgroup summary { cursor: pointer; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-weight: 500; }
  .srcgroup[open] summary { border-radius: 12px 12px 0 0; }
  .srcgroup .list { padding: 8px; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px; background: var(--bg-2); }
  .toprow { display: flex; justify-content: space-between; align-items: center; }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 14px; }
  .theme-row { display: flex; gap: 8px; }
  .theme-row .ghost.on { background: var(--surface-2); border-color: var(--amber); }

  .toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 9; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .loading { display: grid; place-items: center; height: 100%; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  /* Wide landscape screens (laptops): keep the card phone-shaped and centred. Tall screens keep full width. */
  @media (min-width: 720px) and (min-aspect-ratio: 4/5) {
    .feed { padding: 0; }
    .slot { width: 560px; margin: 0 auto; }
  }
</style>

<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div id="app">
  <header class="bar">
    <div class="brand"><span class="flame" aria-hidden="true"></span><h1>לפיד</h1><small id="weekLabel"></small></div>
    <button class="iconbtn" id="btnSettings" aria-label="הגדרות">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <main class="feed" id="feed"><div class="loading">מדליק את הלפיד…</div></main>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(function () {
  'use strict';

  // ---------- storage (per-viewer conveniences only) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('lapid.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('lapid.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  const DATA_BASE = 'data/';
  const state = {
    index: null,
    interests: {},            // id -> loaded json
    selected: store.get('interests', []),
    seen: store.get('seen', {}),
    saved: store.get('saved', []),
    reactions: store.get('reactions', {}),
    theme: store.get('theme', 'light'),
    mediaOK: null,            // can we load external images / iframes?
    items: []
  };

  const $ = (s, el) => (el || document).querySelector(s);
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const initials = name => name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
  const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const ICON_SAVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
  const ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>';
  const ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.3a2 2 0 0 0 2-1.7l1.4-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>';
  const ICON_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.7a2 2 0 0 0-2 1.7l-1.4 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg>';
  const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg>';
  const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

  // ---------- theme ----------
  function applyTheme() {
    const r = document.documentElement;
    if (state.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', state.theme);
  }

  // ---------- seeded shuffle (stable within a day, fresh the next) ----------
  function rng(seed) { let a = seed >>> 0; return () => { a += 0x6D2B79F5; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, seed) { const r = rng(seed); const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- time ----------
  function weekNumber() {
    const epoch = new Date((state.index && state.index.week_epoch) || '2026-09-14');
    const days = Math.floor((Date.now() - epoch.getTime()) / 86400000);
    return Math.max(1, Math.floor(days / 7) + 1);
  }
  const dayNumber = () => Math.floor(Date.now() / 86400000);

  // ---------- media capability probe ----------
  function probeMedia() {
    if (/claude\.ai$|anthropic/.test(location.hostname) || (window.top !== window.self && !/localhost|lovable|flyxforce/.test(location.hostname))) return Promise.resolve(false);
    return new Promise(resolve => {
      const img = new Image();
      let done = false;
      const finish = ok => { if (!done) { done = true; resolve(ok); } };
      img.onload = () => finish(true);
      img.onerror = () => finish(false);
      setTimeout(() => finish(false), 4000);
      img.src = 'https://i.ytimg.com/vi/dQw4w9WgXcQ/default.jpg?probe=' + Date.now();
    });
  }

  // ---------- data ----------
  async function loadJSON(path) { const r = await fetch(DATA_BASE + path, { cache: 'no-cache' }); if (!r.ok) throw new Error(path); return r.json(); }
  async function loadInterests(ids) {
    const missing = ids.filter(id => !state.interests[id]);
    const results = await Promise.allSettled(missing.map(id => loadJSON('interests/' + id + '.json')));
    results.forEach((res, i) => { if (res.status === 'fulfilled') state.interests[missing[i]] = res.value; });
  }

  // ---------- build the feed ----------
  function buildItems() {
    const week = weekNumber();
    const day = dayNumber();
    const byType = { chapter: [], video: [], article: [], leader: [], book: [] };
    const metaOf = id => (state.index.interests.find(x => x.id === id) || { hue: 30, name_he: id });

    for (const id of state.selected) {
      const data = state.interests[id]; if (!data) continue;
      const meta = metaOf(id);
      const books = data.books || [], leaders = data.leaders || [], pubs = data.publications || [], chapters = data.chapters || [];
      const bookById = Object.fromEntries(books.map(b => [b.id, b]));

      // Ideas: for each book, show the first idea the reader has not reacted to yet.
      // A reaction is what moves a book forward; the weekly refresh keeps ~3 new ideas per book ahead.
      const perBook = {};
      chapters.forEach(c => { (perBook[c.book_id] = perBook[c.book_id] || []).push(c); });
      Object.keys(perBook).forEach(bid => {
        const list = perBook[bid].sort((a, b) => a.chapter_index - b.chapter_index);
        const book = bookById[bid]; if (!book) return;
        const keyOf = c => 'ch:' + id + ':' + bid + ':' + c.chapter_index;
        let c = list.find(x => !state.reactions[keyOf(x)]);
        const done = !c;
        if (done) c = list[list.length - 1];
        byType.chapter.push({ type: 'chapter', key: keyOf(c), interest: meta, book, chapter: c, ordinal: list.indexOf(c) + 1, of: list.length, done, liked: list.some(x => state.reactions[keyOf(x)] === 'up') });
      });

      leaders.forEach(L => {
        byType.leader.push({ type: 'leader', key: 'ld:' + id + ':' + L.id, interest: meta, leader: L });
        (L.videos || []).forEach(v => byType.video.push({ type: 'video', key: 'vd:' + id + ':' + v.youtube_id, interest: meta, leader: L, video: v }));
      });
      pubs.forEach(P => (P.articles || []).forEach(a => byType.article.push({ type: 'article', key: 'ar:' + id + ':' + hashStr(a.url), interest: meta, pub: P, article: a })));
      books.forEach((b, i) => { if (!perBook[b.id]) byType.book.push({ type: 'book', key: 'bk:' + id + ':' + b.id, interest: meta, book: b, rank: i + 1 }); });
    }

    // Unseen first, then seen (so nothing repeats until everything else has been shown).
    const disliked = new Set(Object.keys(state.reactions).filter(k => state.reactions[k] === 'down'));
    const leaderDown = it => it.leader && disliked.has('ld:' + it.interest.id + ':' + it.leader.id);
    const rank = it => {
      if (state.reactions[it.key] === 'down' || it.done || leaderDown(it)) return 3;
      if (state.seen[it.key]) return 1;
      if (it.type === 'video' && videoLong(it.video)) return 0.5;
      return it.liked ? -1 : 0;
    };
    const order = t => shuffle(byType[t], day + hashStr(t)).sort((a, b) => rank(a) - rank(b));
    const q = { chapter: order('chapter'), video: order('video'), article: order('article'), leader: order('leader'), book: order('book') };
    // Rhythm of the feed: a chapter, a video, an article, a chapter, a leader or book, an article …
    const pattern = ['chapter', 'video', 'article', 'chapter', 'leader', 'article', 'video', 'book'];
    const out = [];
    let guard = 0;
    while (guard++ < 2000) {
      let pushed = false;
      for (const t of pattern) { const it = q[t].shift(); if (it) { out.push(it); pushed = true; } }
      if (!pushed) break;
    }
    // Same interest rarely twice in a row.
    for (let i = 1; i < out.length - 1; i++) {
      if (out[i].interest.id === out[i - 1].interest.id && out[i + 1].interest.id !== out[i - 1].interest.id) { [out[i], out[i + 1]] = [out[i + 1], out[i]]; }
    }
    state.items = out;
  }

  // ---------- render cards ----------
  function card(it) {
    const c = el('article', 'card c-' + it.type);
    c.style.setProperty('--hue', it.interest.hue);
    c.dataset.key = it.key;
    const scroll = el('div', 'scroll');
    c.appendChild(scroll);
    if (it.type === 'chapter') renderChapter(scroll, it);
    if (it.type === 'video') renderVideo(scroll, it);
    if (it.type === 'article') renderArticle(scroll, it);
    if (it.type === 'leader') renderLeader(scroll, it);
    if (it.type === 'book') renderBook(scroll, it);
    c.appendChild(foot(it));
    c.appendChild(reactRow(it));
    return c;
  }

  function eyebrow(kind, it, extra) {
    return `<div class="eyebrow"><span class="dot"></span><b>${esc(it.interest.name_he)}</b><span>·</span><span>${esc(kind)}</span>${extra ? '<span>·</span><span>' + esc(extra) + '</span>' : ''}</div>`;
  }

  function renderChapter(root, it) {
    const { book, chapter: ch } = it;
    root.innerHTML = `
      <div class="head">${eyebrow('רעיון מהספר', it, `רעיון ${it.ordinal}`)}<h2 class="idea">${esc(ch.idea_he)}</h2></div>
      <p class="body">${esc(ch.body_he)}</p>
      <ul class="points">${(ch.points_he || []).map(p => `<li>${esc(p)}</li>`).join('')}</ul>
      ${ch.apply_he ? `<div class="apply"><b>איך זה נראה בפועל</b>${esc(ch.apply_he)}</div>` : ''}
      ${ch.quote ? `<p class="quote">“${esc(ch.quote)}”</p>` : ''}
      <div class="bookline"><div class="cover" data-cover="${esc(book.title)}|${esc(book.author)}">${esc(initials(book.title))}</div><div><div class="t">${esc(book.title)}</div><div class="a">${esc(book.author)}${book.year ? ' · ' + book.year : ''}</div></div></div>`;
  }

  const LONG_RE = /podcast|episode|\bep\.? ?\d|full (interview|episode|conversation|talk)|#\d{2,}|\bhours?\b|masterclass|\blive\b|lecture/i;
  const videoLong = v => v.duration_min ? v.duration_min > 20 : LONG_RE.test(v.title || '');
  function renderVideo(root, it) {
    const { leader: L, video: v } = it;
    const media = el('div', 'media');
    if (v.duration_min) media.appendChild(el('span', 'dur', esc(v.duration_min) + ' דק׳'));
    else if (videoLong(v)) media.appendChild(el('span', 'dur', 'שיחה ארוכה'));
    const play = el(state.mediaOK ? 'button' : 'a', 'play', ICON_PLAY);
    play.setAttribute('aria-label', 'נגן');
    if (state.mediaOK) {
      const img = new Image(); img.alt = ''; img.src = `https://i.ytimg.com/vi/${encodeURIComponent(v.youtube_id)}/hqdefault.jpg`;
      media.appendChild(img);
      play.addEventListener('click', () => {
        const f = document.createElement('iframe');
        f.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.youtube_id)}?autoplay=1&rel=0&playsinline=1`;
        f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
        f.setAttribute('allowfullscreen', '');
        f.title = v.title;
        media.innerHTML = ''; media.appendChild(f);
      });
    } else {
      media.classList.add('poster');
      media.appendChild(el('span', 'mono', esc(initials(L.name))));
      play.href = v.source_url; play.target = '_blank'; play.rel = 'noopener';
      const hint = el('span', 'hint', 'לצפייה ב-YouTube');
      media.appendChild(hint);
    }
    media.appendChild(play);
    root.appendChild(media);
    const text = el('div', 'text', `${eyebrow('סרטון', it)}
      <h2 class="title">${esc(v.title)}</h2>
      <div class="who"><div class="avatar" data-person="${esc(L.name)}">${esc(initials(L.name))}</div><div><div class="n">${esc(L.name_he || L.name)}</div><div class="r">${esc(L.role_he || '')}</div></div></div>
      ${v.blurb_he ? `<p class="blurb">${esc(v.blurb_he)}</p>` : ''}`);
    root.appendChild(text);
  }

  function renderArticle(root, it) {
    const { pub: P, article: a } = it;
    root.innerHTML = `
      <div class="mast">${state.mediaOK && P.url ? `<img class="logo" alt="" src="https://logo.clearbit.com/${esc(new URL(P.url).hostname)}" onerror="this.remove()">` : ''}<div class="pub">${esc(P.name)}</div><div class="date">${esc(a.published || '')}</div></div>
      <div class="text">${eyebrow('מאמר', it)}
        <h2 class="title" style="margin-top:10px">${esc(a.title)}</h2>
        <p class="summary">${esc(a.summary_he || '')}</p>
        ${P.desc_he ? `<p class="pubdesc">${esc(P.desc_he)}</p>` : ''}
      </div>`;
  }

  function renderLeader(root, it) {
    const L = it.leader;
    root.innerHTML = `
      <div class="hero"><div class="avatar" data-person="${esc(L.name)}">${esc(initials(L.name))}</div><div><h2 class="name">${esc(L.name)}</h2><div class="name-he">${esc(L.name_he || '')}</div></div></div>
      <div class="text">${eyebrow('מוביל דעה', it)}
        <p class="role" style="margin-top:10px">${esc(L.role_he || '')}</p>
        <p class="why">${esc(L.why_he || '')}</p>
        <div class="vids">${(L.videos || []).map(v => `<a href="${esc(v.source_url)}" target="_blank" rel="noopener"><span class="p">${ICON_PLAY}</span><span class="t">${esc(v.title)}</span></a>`).join('')}</div>
      </div>`;
  }

  function renderBook(root, it) {
    const b = it.book;
    root.innerHTML = `
      <div class="hero"><div class="cover" data-cover="${esc(b.title)}|${esc(b.author)}">${esc(initials(b.title))}</div><div><h2 class="title">${esc(b.title)}</h2>${b.title_he ? `<div class="title-he">${esc(b.title_he)}</div>` : ''}<div class="author">${esc(b.author)}${b.year ? ' · ' + b.year : ''}</div></div></div>
      <div class="text">${eyebrow('ספר להכיר', it)}
        <p class="why" style="margin-top:10px">${esc(b.why_he || '')}</p>
        <p class="rank">מקום ${it.rank} ברשימת 30 הספרים המובילים בתחום</p>
      </div>`;
  }

  function foot(it) {
    const f = el('div', 'foot');
    const links = el('div', 'links');
    const primary = it.type === 'video' ? it.video.source_url : it.type === 'article' ? it.article.url : null;
    if (primary) links.appendChild(link(primary, it.type === 'video' ? 'YouTube' : 'לקריאה', true));
    if (it.type === 'chapter') (it.chapter.sources || []).slice(0, 2).forEach((s, i) => links.appendChild(link(s, i === 0 ? 'מקור' : 'מקור נוסף', false)));
    if (it.type === 'leader') links.appendChild(link('https://www.youtube.com/results?search_query=' + encodeURIComponent(it.leader.name), 'עוד סרטונים', false));
    if (it.type === 'book') links.appendChild(link('https://www.google.com/search?q=' + encodeURIComponent(it.book.title + ' ' + it.book.author + ' book'), 'על הספר', false));
    f.appendChild(links);
    const save = el('button', 'chip' + (isSaved(it.key) ? ' saved' : ''), ICON_SAVE + '<span>' + (isSaved(it.key) ? 'נשמר' : 'שמור') + '</span>');
    save.addEventListener('click', () => { toggleSave(it); save.className = 'chip' + (isSaved(it.key) ? ' saved' : ''); save.querySelector('span').textContent = isSaved(it.key) ? 'נשמר' : 'שמור'; });
    f.appendChild(save);
    return f;
  }
  function reactRow(it) {
    const r = el('div', 'react');
    r.appendChild(el('span', 'q', 'איך היה?'));
    const opts = [['up', ICON_UP, 'אהבתי'], ['ok', ICON_OK, 'סבבה'], ['down', ICON_DOWN, 'לא בשבילי']];
    const btns = opts.map(([v, icon, label]) => {
      const b = el('button', v, icon + '<span>' + label + '</span>');
      b.setAttribute('aria-pressed', state.reactions[it.key] === v);
      b.classList.toggle('on', state.reactions[it.key] === v);
      b.addEventListener('click', () => {
        if (state.reactions[it.key] === v) delete state.reactions[it.key]; else state.reactions[it.key] = v;
        store.set('reactions', state.reactions);
        btns.forEach(x => { const on = state.reactions[it.key] === x.className.split(' ')[0]; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
      });
      return b;
    });
    btns.forEach(b => r.appendChild(b));
    return r;
  }
  function link(href, label, primary) { const a = el('a', 'chip' + (primary ? ' primary' : ''), ICON_LINK + '<span>' + esc(label) + '</span>'); a.href = href; a.target = '_blank'; a.rel = 'noopener'; return a; }

  function isSaved(key) { return state.saved.some(s => s.key === key); }
  function toggleSave(it) {
    if (isSaved(it.key)) { state.saved = state.saved.filter(s => s.key !== it.key); toast('הוסר מהשמורים'); }
    else { state.saved.unshift({ key: it.key, title: itemTitle(it), url: itemUrl(it) }); toast('נשמר'); }
    store.set('saved', state.saved);
  }
  function itemTitle(it) {
    if (it.type === 'chapter') return it.book.title + ' — ' + it.chapter.idea_he;
    if (it.type === 'video') return it.video.title;
    if (it.type === 'article') return it.article.title;
    if (it.type === 'leader') return it.leader.name;
    return it.book.title;
  }
  function itemUrl(it) {
    if (it.type === 'video') return it.video.source_url;
    if (it.type === 'article') return it.article.url;
    if (it.type === 'chapter') return (it.chapter.sources || [])[0] || '';
    if (it.type === 'leader') return ((it.leader.videos || [])[0] || {}).source_url || '';
    return '';
  }

  // ---------- feed rendering (windowed) ----------
  let rendered = 0;
  const BATCH = 12;
  function renderFeed(reset) {
    const feed = $('#feed');
    if (reset) { feed.innerHTML = ''; rendered = 0; feed.scrollTop = 0; }
    const frag = document.createDocumentFragment();
    const end = Math.min(state.items.length, rendered + BATCH);
    for (let i = rendered; i < end; i++) { const slot = el('section', 'slot'); slot.appendChild(card(state.items[i])); frag.appendChild(slot); }
    rendered = end;
    if (rendered >= state.items.length) {
      const slot = el('section', 'slot');
      const c = el('article', 'card c-end');
      c.innerHTML = state.items.length ? '<div><h2>זה הכל להיום.</h2><p>מחר הסדר מתערבב מחדש, תגובה על כרטיס פותחת את הרעיון הבא מאותו ספר.</p></div>' : '<div><h2>אין עדיין תוכן.</h2><p>בחר תחומי עניין בהגדרות כדי להדליק את הלפיד.</p></div>';
      slot.appendChild(c); frag.appendChild(slot);
    }
    feed.appendChild(frag);
    observeCards();
    if (state.mediaOK) { resolveCovers(); resolvePortraits(); }
  }

  let io;
  function observeCards() {
    if (!('IntersectionObserver' in window)) return;
    if (!io) io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.intersectionRatio > 0.6) {
          const key = e.target.dataset.key; if (key && !state.seen[key]) { state.seen[key] = dayNumber(); store.set('seen', state.seen); }
          const idx = Array.from($('#feed').children).indexOf(e.target.parentElement);
          if (idx >= rendered - 4 && rendered < state.items.length) renderFeed(false);
        } else if (e.intersectionRatio < 0.2) {
          const f = e.target.querySelector('iframe'); if (f) { const m = f.parentElement; const it = state.items.find(x => x.key === e.target.dataset.key); if (it) { m.innerHTML = ''; const card2 = card(it); e.target.replaceWith(card2); io.observe(card2); } }
        }
      });
    }, { root: $('#feed'), threshold: [0.2, 0.6] });
    document.querySelectorAll('#feed .card[data-key]').forEach(c => io.observe(c));
  }

  // Book covers from Open Library (only when the page may load external images; falls back to the typographic cover).
  const coverCache = store.get('covers', {});
  async function resolveCovers() {
    const nodes = Array.from(document.querySelectorAll('.cover[data-cover]:not([data-done])'));
    for (const n of nodes) {
      n.dataset.done = '1';
      const [title, author] = n.dataset.cover.split('|');
      const k = title + '|' + author;
      try {
        if (!(k in coverCache)) {
          const r = await fetch('https://openlibrary.org/search.json?title=' + encodeURIComponent(title) + '&author=' + encodeURIComponent(author) + '&limit=1&fields=cover_i');
          const j = await r.json();
          coverCache[k] = (j.docs && j.docs[0] && j.docs[0].cover_i) || 0;
          store.set('covers', coverCache);
        }
        if (coverCache[k]) { const img = new Image(); img.alt = ''; img.onload = () => { n.textContent = ''; n.appendChild(img); }; img.src = 'https://covers.openlibrary.org/b/id/' + coverCache[k] + '-M.jpg'; }
      } catch (e) { /* keep typographic cover */ }
    }
  }

  // Portraits of thought leaders from Wikipedia (public, no key). Falls back to initials.
  const portraitCache = store.get('portraits', {});
  async function resolvePortraits() {
    const nodes = Array.from(document.querySelectorAll('.avatar[data-person]:not([data-done])'));
    for (const n of nodes) {
      n.dataset.done = '1';
      const name = n.dataset.person;
      try {
        if (!(name in portraitCache)) {
          const r = await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(name.replace(/ /g, '_')));
          const j = r.ok ? await r.json() : {};
          portraitCache[name] = (j.type === 'standard' && j.thumbnail && j.thumbnail.source) || '';
          store.set('portraits', portraitCache);
        }
        if (portraitCache[name]) { const img = new Image(); img.alt = ''; img.onload = () => { n.textContent = ''; n.appendChild(img); }; img.src = portraitCache[name]; }
      } catch (e) { /* keep initials */ }
    }
  }

  // ---------- onboarding & settings ----------
  function openScreen(html) { const s = el('div', 'screen'); s.innerHTML = '<div class="inner">' + html + '</div>'; $('#app').appendChild(s); return s; }

  function onboarding(firstTime) {
    const picked = new Set(state.selected);
    const s = openScreen(`
      ${firstTime ? '' : '<div class="toprow"><button class="ghost" id="back">חזרה</button></div>'}
      <h2 style="margin-top:${firstTime ? 0 : 18}px">מה מעניין אותך?</h2>
      <p class="lede">סמן תחומים. הלפיד מרכיב את התוכן לבד: לכל תחום 30 ספרים מובילים, 10 מובילי דעה ו-5 כתבי עת. הספרים לא מסוכמים פרק-פרק: כל כרטיס הוא רעיון מרכזי אחד מהספר, כשאתה מגיב על כרטיס, הרעיון הבא מאותו ספר נכנס. כל שבוע נוספים שלושה רעיונות לכל ספר. בלי יעדים, בלי התראות.</p>
      <div class="tiles" id="tiles"></div>
      <button class="cta" id="go" disabled>${firstTime ? 'הדלק את הלפיד' : 'עדכן את התוכן'}</button>
      <p class="fine">אפשר לשנות בכל רגע מההגדרות.</p>`);
    const tiles = $('#tiles', s);
    state.index.interests.forEach(m => {
      const t = el('button', 'tile' + (picked.has(m.id) ? ' on' : ''), `<span class="sw"></span><span class="n">${esc(m.name_he)}</span><span class="check">${ICON_CHECK}</span>`);
      t.style.setProperty('--hue', m.hue); t.setAttribute('aria-pressed', picked.has(m.id));
      t.addEventListener('click', () => { picked.has(m.id) ? picked.delete(m.id) : picked.add(m.id); t.classList.toggle('on', picked.has(m.id)); t.setAttribute('aria-pressed', picked.has(m.id)); $('#go', s).disabled = picked.size === 0; });
      tiles.appendChild(t);
    });
    $('#go', s).disabled = picked.size === 0;
    $('#go', s).addEventListener('click', async () => {
      $('#go', s).disabled = true; $('#go', s).textContent = 'מרכיב את התוכן…';
      state.selected = state.index.interests.map(m => m.id).filter(id => picked.has(id));
      store.set('interests', state.selected);
      await loadInterests(state.selected);
      buildItems(); renderFeed(true); s.remove(); updateWeekLabel();
    });
    const back = $('#back', s); if (back) back.addEventListener('click', () => s.remove());
  }

  function settings() {
    const s = openScreen(`
      <div class="toprow"><h2 style="font-size:28px">הגדרות</h2><button class="ghost" id="close">סגור</button></div>
      <div class="sect"><h3>תחומי עניין</h3><div class="list" id="sel"></div><button class="ghost" id="edit" style="margin-top:10px">שנה תחומים</button></div>
      <div class="sect"><h3>מראה</h3><div class="theme-row">
        <button class="ghost ${state.theme === 'system' ? 'on' : ''}" data-theme="system">אוטומטי</button>
        <button class="ghost ${state.theme === 'dark' ? 'on' : ''}" data-theme="dark">כהה</button>
        <button class="ghost ${state.theme === 'light' ? 'on' : ''}" data-theme="light">בהיר</button></div></div>
      <div class="sect"><h3>שמורים (${state.saved.length})</h3><div class="list" id="savedList"></div></div>
      <div class="sect"><h3>המקורות</h3><p class="fine" style="margin:0 0 10px">כל ספר, אדם וכתב עת שמזינים את הלפיד, לפי תחום. שום דבר לא מומצא: כל כרטיס מקשר למקור שלו.</p><div id="srcs"></div></div>
      <div class="sect"><button class="ghost" id="resetSeen">אפס את מה שכבר ראיתי ואת התגובות</button></div>`);
    const sel = $('#sel', s);
    state.selected.forEach(id => { const m = state.index.interests.find(x => x.id === id); if (m) sel.appendChild(el('div', 'row', `<span>${esc(m.name_he)}</span>`)); });
    if (!state.selected.length) sel.appendChild(el('div', 'row', '<span class="s">עדיין לא נבחרו תחומים</span>'));
    $('#edit', s).addEventListener('click', () => { s.remove(); onboarding(false); });
    $('#close', s).addEventListener('click', () => s.remove());
    s.querySelectorAll('[data-theme]').forEach(b => b.addEventListener('click', () => { state.theme = b.dataset.theme; store.set('theme', state.theme); applyTheme(); s.querySelectorAll('[data-theme]').forEach(x => x.classList.toggle('on', x === b)); }));
    const sl = $('#savedList', s);
    if (!state.saved.length) sl.appendChild(el('div', 'row', '<span class="s">לחיצה על "שמור" בכרטיס תאסוף אותו לכאן.</span>'));
    state.saved.forEach(v => { const r = el('div', 'row', `<span class="l">${esc(v.title)}</span>${v.url ? `<a class="chip" href="${esc(v.url)}" target="_blank" rel="noopener">פתח</a>` : ''}`); sl.appendChild(r); });
    const srcs = $('#srcs', s);
    state.selected.forEach(id => {
      const d = state.interests[id]; if (!d) return;
      const g = el('details', 'srcgroup');
      g.innerHTML = `<summary>${esc(d.name_he)}</summary><div class="list">
        <div class="row"><span>ספרים</span><span class="s">${(d.books || []).length}</span></div>
        ${(d.books || []).map((b, i) => `<div class="row"><span class="l">${i + 1}. ${esc(b.title)} <span class="s">— ${esc(b.author)}</span></span></div>`).join('')}
        <div class="row"><span>מובילי דעה</span><span class="s">${(d.leaders || []).length}</span></div>
        ${(d.leaders || []).map(L => `<div class="row"><span class="l">${esc(L.name)}</span><span class="s">${esc(L.role_he || '')}</span></div>`).join('')}
        <div class="row"><span>כתבי עת</span><span class="s">${(d.publications || []).length}</span></div>
        ${(d.publications || []).map(P => `<div class="row"><span class="l">${esc(P.name)}</span><a class="chip" href="${esc(P.url)}" target="_blank" rel="noopener">אתר</a></div>`).join('')}
      </div>`;
      srcs.appendChild(g);
    });
    $('#resetSeen', s).addEventListener('click', () => { state.seen = {}; store.set('seen', {}); state.reactions = {}; store.set('reactions', {}); buildItems(); renderFeed(true); toast('אופס'); s.remove(); });
  }

  function updateWeekLabel() { $('#weekLabel').textContent = state.selected.length ? 'שבוע ' + weekNumber() : ''; }
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }

  // ---------- boot ----------
  // Some hosts (in-app browsers, desktop mode) give a phone a desktop-sized viewport.
  // Scale the whole app so the layout always matches a ~430px-wide phone in portrait.
  function fitViewport() {
    const w = window.innerWidth, h = window.innerHeight;
    const wide = h > w * 1.25 && w > 560;
    $('#app').style.zoom = wide ? String(Math.min(w / 430, 3.2)) : '';
  }
  async function boot() {
    fitViewport();
    window.addEventListener('resize', fitViewport);
    applyTheme();
    document.documentElement.setAttribute('dir', 'rtl');
    $('#btnSettings').addEventListener('click', settings);
    try { state.index = await loadJSON('index.json'); }
    catch (e) { $('#feed').innerHTML = '<div class="loading">לא הצלחתי לטעון את הנתונים. נסה לרענן.</div>'; return; }
    const [mediaOK] = await Promise.all([probeMedia(), loadInterests(state.selected)]);
    state.mediaOK = mediaOK;
    buildItems();
    renderFeed(true);
    updateWeekLabel();
    if (!state.selected.length) onboarding(true);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
<!--BODY-END-->
</body>
</html>
